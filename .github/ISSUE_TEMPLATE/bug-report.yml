name: Bug report
description: Something is broken or shows the wrong numbers.
title: "[Snyk Pulse] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Never paste Snyk tokens, signed download URLs or customer data.** Redact org/project names if needed."
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Snyk Pulse
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. node snyk-pulse/pulse.mjs --csv issues.csv
        2. Open Application security
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - CSV import
        - Snyk API pull
        - Demo data
        - Not applicable
  - type: input
    id: node
    attributes:
      label: Node version (node --version) and OS
      placeholder: v24.11.1 · macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or terminal output
      description: Pulse redacts tokens in its messages, but double-check before posting.
      render: text
